<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#001f54">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Los Mayorga - Distribuidora Mayorista</title>
    
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🛒</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #001f54;
            --primary-dark: #000f2e;
            --primary-light: #003d7a;
            --accent: #e65100;
            --accent-light: #ff8c00;
            --success: #00a650;
            --warning: #ffc107;
            --danger: #dc3545;
            --text-dark: #1a1a1a;
            --text-light: #666;
            --border: #e2e8f0;
            --bg-light: #f5f5f5;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.12);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.15);
            --safe-area-inset-top: env(safe-area-inset-top, 0px);
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 20px);
            --safe-area-inset-left: env(safe-area-inset-left, 0px);
            --safe-area-inset-right: env(safe-area-inset-right, 0px);
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #fff;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            padding-top: 140px;
            padding-bottom: calc(70px + var(--safe-area-inset-bottom));
            overflow-x: hidden;
        }

        /* ==================== HEADER ==================== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: #fff;
            padding-top: var(--safe-area-inset-top);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            height: 60px;
            gap: 12px;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
            text-decoration: none;
            color: var(--primary);
        }

        .header-logo-icon {
            font-size: 28px;
            flex-shrink: 0;
        }

        .header-logo-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .header-logo-text h1 {
            font-size: 16px;
            font-weight: 900;
            margin: 0;
            line-height: 1.2;
            white-space: nowrap;
        }

        .header-logo-text p {
            font-size: 11px;
            color: var(--text-light);
            margin: 0;
            white-space: nowrap;
            display: none;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .header-btn {
            background: transparent;
            border: none;
            color: var(--primary);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            min-width: 40px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .header-btn:active {
            background: rgba(0,31,84,0.1);
            transform: scale(0.95);
        }

        /* SEARCH BAR */
        .header-search {
            padding: 0 16px 12px 16px;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-light);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .search-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,31,84,0.1);
        }

        .search-box-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            color: var(--text-light);
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 0;
            font-size: 14px;
            outline: none;
            -webkit-appearance: none;
            color: var(--text-dark);
        }

        .search-input::placeholder {
            color: var(--text-light);
        }

        .search-clear {
            display: none;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            color: var(--text-light);
            background: transparent;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .search-clear.visible {
            display: flex;
        }

        .search-clear:hover {
            color: var(--primary);
        }

        .search-brands {
            padding: 0 16px 12px 16px;
        }

        .brands-select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            background: #fff;
            color: var(--text-dark);
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23001f54' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 18px;
            padding-right: 36px;
        }

        /* ==================== FILTROS ==================== */
        .filters-bar {
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-bottom: 1px solid var(--border);
        }

        .filter-btn {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text-dark);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            -webkit-tap-highlight-color: transparent;
        }

        .filter-btn:active {
            transform: scale(0.95);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* ==================== MAIN CONTENT ==================== */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0;
        }

        /* BANNER */
        .banner-section {
            padding: 16px;
        }

        .banner {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            box-shadow: var(--shadow-md);
        }

        .banner-text h2 {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 8px 0;
        }

        .banner-text p {
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
            line-height: 1.4;
        }

        .banner-icon {
            font-size: 48px;
            flex-shrink: 0;
        }

        /* PRODUCTS SECTION */
        .products-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .products-title {
            font-size: 18px;
            font-weight: 700;
            margin: 0;
        }

        .products-sort {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            background: #fff;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            min-width: 140px;
        }

        /* GRID DE PRODUCTOS */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 12px;
            margin-bottom: 20px;
        }

        @media (min-width: 640px) {
            .products-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
                padding: 0 16px;
            }
        }

        @media (min-width: 1024px) {
            .products-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 16px;
                padding: 0 16px;
            }
        }

        /* PRODUCT CARD */
        .product-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .product-card:active {
            transform: scale(0.98);
            box-shadow: var(--shadow-md);
        }

        .product-image {
            width: 100%;
            height: 160px;
            background: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            position: relative;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 8px;
        }

        .product-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--danger);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
        }

        .product-info {
            padding: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .product-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            margin: 0 0 8px 0;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin: 0 0 8px 0;
        }

        .product-description {
            font-size: 12px;
            color: var(--text-light);
            margin: 0 0 8px 0;
        }

        .product-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: auto;
            -webkit-tap-highlight-color: transparent;
        }

        .product-btn:active {
            background: var(--primary-dark);
            transform: scale(0.95);
        }

        .product-btn.disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* LOADER */
        .loader {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }

        .loader-spinner {
            font-size: 32px;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 8px 0;
        }

        .empty-state-text {
            font-size: 14px;
            margin: 0;
        }

        /* ==================== CART FLOAT ==================== */
        .cart-button {
            position: fixed;
            right: 16px;
            bottom: calc(16px + var(--safe-area-inset-bottom));
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 500;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .cart-button:active {
            transform: scale(0.95);
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--danger);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            border: 2px solid white;
        }

        /* ==================== MODALS ==================== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: #fff;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            margin: 0;
        }

        .modal-close {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-light);
        }

        .modal-body {
            padding: 16px;
        }

        /* ==================== PROMO POPUP ==================== */
        .promo-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.4s ease;
        }

        .promo-popup.active {
            display: flex;
        }

        .promo-card {
            background: #fff;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            animation: scaleIn 0.4s ease;
        }

        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .promo-header {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            padding: 20px 16px;
            text-align: center;
        }

        .promo-header h2 {
            font-size: 24px;
            font-weight: 900;
            margin: 0 0 8px 0;
        }

        .promo-header p {
            font-size: 14px;
            margin: 0;
            opacity: 0.9;
        }

        .promo-content {
            padding: 16px;
        }

        .promo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .promo-item {
            background: var(--bg-light);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .promo-item:active {
            background: #e0e0e0;
        }

        .promo-item-emoji {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .promo-item-name {
            font-size: 12px;
            font-weight: 600;
            margin: 0 0 4px 0;
        }

        .promo-item-price {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            margin: 0;
        }

        .promo-footer {
            padding: 12px 16px 16px;
            text-align: center;
        }

        .promo-close {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (min-width: 640px) {
            body {
                padding-top: 150px;
            }

            .header-logo-text p {
                display: block;
            }

            .header-top {
                padding: 14px 20px;
                height: 65px;
            }

            .header-logo-text h1 {
                font-size: 18px;
            }

            .header-logo-text p {
                font-size: 12px;
            }

            .header-search, .search-brands {
                padding: 0 20px 12px 20px;
            }

            .products-header, .banner-section, .filters-bar {
                padding-left: 20px;
                padding-right: 20px;
            }

            .promo-card {
                max-width: 500px;
            }
        }

        @media (min-width: 1024px) {
            body {
                padding-top: 160px;
            }

            .header-top {
                padding: 16px 40px;
                height: 70px;
            }

            .header-logo-text h1 {
                font-size: 20px;
            }

            .header-search, .search-brands, .products-header, .banner-section, .filters-bar {
                padding-left: 40px;
                padding-right: 40px;
            }

            .cart-button {
                width: 70px;
                height: 70px;
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-top">
            <a href="#" class="header-logo">
                <div class="header-logo-icon">🛒</div>
                <div class="header-logo-text">
                    <h1>Los Mayorga</h1>
                    <p>Distribuidora Mayorista</p>
                </div>
            </a>
            <div class="header-actions">
                <button class="header-btn" onclick="openModal('login')" title="Acceso">
                    <i class="fas fa-lock"></i>
                </button>
                <button class="header-btn" onclick="toggleMenu()" title="Menú">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>

        <div class="header-search">
            <div class="search-box">
                <div class="search-box-icon">
                    <i class="fas fa-search"></i>
                </div>
                <input 
                    type="text" 
                    class="search-input" 
                    id="search-input" 
                    placeholder="Buscar productos..."
                    oninput="handleSearch()"
                >
                <button class="search-clear" id="search-clear" onclick="clearSearch()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <div class="search-brands">
            <select class="brands-select" id="brands-select" onchange="onBrandChange()">
                <option value="TODOS">Todas las Marcas</option>
            </select>
        </div>
    </header>

    <!-- FILTERS -->
    <div class="filters-bar" id="filters-bar"></div>

    <!-- MAIN -->
    <main class="main-content">
        <!-- BANNER -->
        <div class="banner-section">
            <div class="banner">
                <div class="banner-text">
                    <h2><i class="fas fa-truck" style="margin-right: 8px;"></i>Envíos Express</h2>
                    <p>Repartos directos en Rincón de los Sauces para comercios y familias</p>
                </div>
                <div class="banner-icon">📦</div>
            </div>
        </div>

        <!-- PRODUCTOS HEADER -->
        <div class="products-header">
            <h2 class="products-title">Catálogo</h2>
            <select class="products-sort" id="sort-select" onchange="onSortChange()">
                <option value="default">Relevancia</option>
                <option value="price-asc">Menor precio</option>
                <option value="price-desc">Mayor precio</option>
                <option value="newest">Más nuevo</option>
                <option value="name-asc">A - Z</option>
                <option value="name-desc">Z - A</option>
            </select>
        </div>

        <!-- PRODUCTOS GRID -->
        <div class="products-grid" id="products-grid">
            <div class="loader">
                <div class="loader-spinner">⏳</div>
                <p>Cargando productos...</p>
            </div>
        </div>
    </main>

    <!-- CARRITO FLOTANTE -->
    <button class="cart-button" onclick="openCart()">
        <i class="fas fa-shopping-cart"></i>
        <div class="cart-count" id="cart-count" style="display: none;">0</div>
    </button>

    <!-- MODALS -->
    <div class="modal" id="modal-login">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Acceso Preventista</h2>
                <button class="modal-close" onclick="closeModal('login')">✕</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 16px;">Ingresa tu clave de distribuidor:</p>
                <input type="password" id="login-key" placeholder="Clave" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 12px;">
                <button onclick="loginPreventa()" style="width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer;">Ingresar</button>
            </div>
        </div>
    </div>

    <div class="modal" id="modal-cart">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Carrito</h2>
                <button class="modal-close" onclick="closeModal('cart')">✕</button>
            </div>
            <div class="modal-body" id="cart-body">
                <p style="text-align: center; color: var(--text-light);">Tu carrito está vacío</p>
            </div>
        </div>
    </div>

    <!-- PROMO POPUP -->
    <div class="promo-popup" id="promo-popup">
        <div class="promo-card">
            <div class="promo-header">
                <h2 id="promo-title">🔥 OFERTAS</h2>
                <p id="promo-subtitle">Productos destacados</p>
            </div>
            <div class="promo-content">
                <div class="promo-grid" id="promo-grid"></div>
            </div>
            <div class="promo-footer">
                <button class="promo-close" onclick="closePromo()">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== VARIABLES GLOBALES ====================
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTTtIs8b6w2l3XSTbkTw0bnqh2SXfTebJjITShgpPJ-jxImqOpnY1rjVHHYNRFqqQBypLxeCKFPrK-C/pub?gid=957503224&single=true&output=csv';
        
        let ALL_PRODUCTS = [];
        let FILTERED_PRODUCTS = [];
        let CART = {};
        let currentSort = 'default';
        let currentFilter = 'TODOS';

        const PREVENTA_KEYS = {
            "PREV2026A": "Iván",
            "PREV2026B": "Ulises",
            "PREV2026C": "Directo"
        };

        // ==================== INICIALIZACIÓN ====================
        document.addEventListener('DOMContentLoaded', () => {
            console.log('%c🛒 LOS MAYORGA APP', 'font-size: 18px; font-weight: bold; color: #001f54;');
            loadProducts();
        });

        // ==================== CARGAR PRODUCTOS ====================
        async function loadProducts() {
            try {
                console.log('⏳ Cargando productos del Google Sheet...');
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const csv = await response.text();
                parseProducts(csv);
                console.log(`✅ ${ALL_PRODUCTS.length} productos cargados`);
                filterAndRender();
            } catch (error) {
                console.error('❌ Error:', error);
                document.getElementById('products-grid').innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="empty-state-icon">❌</div>
                        <div class="empty-state-title">Error al cargar productos</div>
                        <div class="empty-state-text">Verifica tu conexión e intenta recargar</div>
                    </div>
                `;
            }
        }

        // ==================== PARSEAR CSV ====================
        function parseProducts(csv) {
            const lines = csv.trim().split('\n');
            if (lines.length < 2) return;

            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            
            for (let i = 1; i < lines.length; i++) {
                const row = {};
                const values = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                headers.forEach((h, idx) => {
                    row[h] = (values[idx] || '').trim().replace(/^"|"$/g, '');
                });

                // Validaciones
                if (row['Desactivar']?.toLowerCase() === '1') continue;
                const price = parseFloat(row['Precio Individual']) || 0;
                if (price <= 0) continue;

                ALL_PRODUCTS.push({
                    id: row['🔒 Row ID'] || i,
                    title: row['Producto'] || 'Producto',
                    brand: row['Marca'] || 'Otras',
                    price: price,
                    image: formatImageUrl(row['Imagen del Producto']),
                    category: row['Engloba en'] || 'General',
                    description: row['Características'] || '',
                    isPromo: !!row['En Promo'],
                    isNew: !!row['Nuevo'],
                    isOutOfStock: row['Sin Stock']?.toLowerCase() === '1'
                });
            }

            renderFilters();
            renderBrands();
        }

        function formatImageUrl(url) {
            if (!url) return null;
            if (url.includes('drive.google.com')) {
                const id = url.match(/\/d\/([a-zA-Z0-9-_]+)/)?.[1];
                if (id) return `https://lh3.googleusercontent.com/d/${id}=w500`;
            }
            return url;
        }

        // ==================== FILTROS ====================
        function renderFilters() {
            const filters = ['TODOS', 'OFERTAS', 'NUEVOS'];
            const html = filters.map(f => `
                <button class="filter-btn ${f === currentFilter ? 'active' : ''}" onclick="setFilter('${f}')">
                    ${f === 'OFERTAS' ? '🔥' : f === 'NUEVOS' ? '✨' : '📦'} ${f}
                </button>
            `).join('');
            document.getElementById('filters-bar').innerHTML = html;
        }

        function setFilter(filter) {
            currentFilter = filter;
            renderFilters();
            filterAndRender();
        }

        function renderBrands() {
            const brands = ['TODOS', ...new Set(ALL_PRODUCTS.map(p => p.brand))].sort();
            const select = document.getElementById('brands-select');
            select.innerHTML = brands.map(b => `<option value="${b}">${b}</option>`).join('');
        }

        function onBrandChange() {
            filterAndRender();
        }

        // ==================== BÚSQUEDA ====================
        function handleSearch() {
            updateSearchClear();
            filterAndRender();
        }

        function updateSearchClear() {
            const input = document.getElementById('search-input');
            const clear = document.getElementById('search-clear');
            if (input.value.length > 0) {
                clear.classList.add('visible');
            } else {
                clear.classList.remove('visible');
            }
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            updateSearchClear();
            filterAndRender();
        }

        // ==================== ORDENAMIENTO ====================
        function onSortChange() {
            currentSort = document.getElementById('sort-select').value;
            filterAndRender();
        }

        // ==================== FILTRAR Y RENDERIZAR ====================
        function filterAndRender() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const brand = document.getElementById('brands-select').value;

            FILTERED_PRODUCTS = ALL_PRODUCTS.filter(p => {
                const matchesQuery = p.title.toLowerCase().includes(query);
                const matchesBrand = brand === 'TODOS' || p.brand === brand;
                let matchesFilter = true;

                if (currentFilter === 'OFERTAS') matchesFilter = p.isPromo;
                if (currentFilter === 'NUEVOS') matchesFilter = p.isNew;

                return matchesQuery && matchesBrand && matchesFilter;
            });

            // Ordenar
            if (currentSort === 'price-asc') FILTERED_PRODUCTS.sort((a, b) => a.price - b.price);
            if (currentSort === 'price-desc') FILTERED_PRODUCTS.sort((a, b) => b.price - a.price);
            if (currentSort === 'name-asc') FILTERED_PRODUCTS.sort((a, b) => a.title.localeCompare(b.title));
            if (currentSort === 'name-desc') FILTERED_PRODUCTS.sort((a, b) => b.title.localeCompare(a.title));

            renderProducts();
            
            // Mostrar popup de promos si es la primera vez
            if (currentFilter === 'TODOS' && FILTERED_PRODUCTS.length > 0 && !sessionStorage.getItem('promo-shown')) {
                const promos = ALL_PRODUCTS.filter(p => p.isPromo).slice(0, 4);
                if (promos.length > 0) {
                    showPromo('🔥 OFERTAS', 'Productos con descuento', promos);
                    sessionStorage.setItem('promo-shown', 'true');
                }
            }
        }

        // ==================== RENDERIZAR PRODUCTOS ====================
        function renderProducts() {
            const grid = document.getElementById('products-grid');
            
            if (FILTERED_PRODUCTS.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="empty-state-icon">📭</div>
                        <div class="empty-state-title">Sin resultados</div>
                        <div class="empty-state-text">No encontramos productos para tu búsqueda</div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = FILTERED_PRODUCTS.map(p => `
                <div class="product-card">
                    <div class="product-image">
                        ${p.image ? `<img src="${p.image}" alt="${p.title}">` : `<div style="font-size: 48px;">📦</div>`}
                        ${p.isPromo ? '<div class="product-badge">🔥 OFERTA</div>' : ''}
                    </div>
                    <div class="product-info">
                        <h3 class="product-title">${p.title}</h3>
                        <div class="product-price">$${p.price.toLocaleString('es-AR')}</div>
                        <div class="product-description">${p.brand}</div>
                        <button class="product-btn ${p.isOutOfStock ? 'disabled' : ''}" onclick="addToCart('${p.id}', '${p.title}', ${p.price})" ${p.isOutOfStock ? 'disabled' : ''}>
                            ${p.isOutOfStock ? 'Sin Stock' : '+ Agregar'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ==================== CARRITO ====================
        function addToCart(id, title, price) {
            if (!CART[id]) {
                CART[id] = { title, price, qty: 0 };
            }
            CART[id].qty++;
            updateCartCount();
            console.log(`✅ ${title} agregado al carrito`);
        }

        function updateCartCount() {
            const total = Object.values(CART).reduce((sum, item) => sum + item.qty, 0);
            const badge = document.getElementById('cart-count');
            if (total > 0) {
                badge.textContent = total;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        function openCart() {
            const body = document.getElementById('cart-body');
            const items = Object.entries(CART);
            
            if (items.length === 0) {
                body.innerHTML = '<p style="text-align: center; color: var(--text-light);">Tu carrito está vacío</p>';
                openModal('cart');
                return;
            }

            const total = items.reduce((sum, [id, item]) => sum + (item.price * item.qty), 0);
            body.innerHTML = `
                <div>${items.map(([id, item]) => `
                    <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border);">
                        <div>
                            <div style="font-weight: 600;">${item.title}</div>
                            <div style="font-size: 12px; color: var(--text-light);">$${item.price} x ${item.qty}</div>
                        </div>
                        <div style="font-weight: 600;">$${(item.price * item.qty).toLocaleString('es-AR')}</div>
                    </div>
                `).join('')}</div>
                <div style="padding: 16px 0; border-top: 1px solid var(--border); margin-top: 12px;">
                    <div style="display: flex; justify-content: space-between; font-size: 16px; font-weight: 700;">
                        <div>Total:</div>
                        <div>$${total.toLocaleString('es-AR')}</div>
                    </div>
                </div>
                <button onclick="checkout()" style="width: 100%; padding: 12px; background: var(--success); color: white; border: none; border-radius: 6px; font-weight: 700; margin-top: 16px; cursor: pointer;">
                    Enviar por WhatsApp
                </button>
            `;
            openModal('cart');
        }

        function checkout() {
            const items = Object.entries(CART);
            const total = items.reduce((sum, [id, item]) => sum + (item.price * item.qty), 0);
            const message = `Hola, me interesa comprar:\n\n${items.map(([id, item]) => `• ${item.title} - $${item.price} x ${item.qty} = $${(item.price * item.qty).toLocaleString('es-AR')}`).join('\n')}\n\nTotal: $${total.toLocaleString('es-AR')}`;
            
            const whatsapp = '5492994051600';
            window.open(`https://wa.me/${whatsapp}?text=${encodeURIComponent(message)}`);
        }

        // ==================== MODALS ====================
        function openModal(id) {
            document.getElementById(`modal-${id}`).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(`modal-${id}`).classList.remove('active');
        }

        // ==================== PROMO ====================
        function showPromo(title, subtitle, items) {
            document.getElementById('promo-title').textContent = title;
            document.getElementById('promo-subtitle').textContent = subtitle;
            document.getElementById('promo-grid').innerHTML = items.map(p => `
                <div class="promo-item" onclick="addToCart('${p.id}', '${p.title}', ${p.price})">
                    <div class="promo-item-emoji">${p.image ? '📦' : '📦'}</div>
                    <div class="promo-item-name">${p.title}</div>
                    <div class="promo-item-price">$${p.price.toLocaleString('es-AR')}</div>
                </div>
            `).join('');
            document.getElementById('promo-popup').classList.add('active');
        }

        function closePromo() {
            document.getElementById('promo-popup').classList.remove('active');
        }

        // ==================== PREVENTA ====================
        function loginPreventa() {
            const key = document.getElementById('login-key').value;
            if (PREVENTA_KEYS[key]) {
                alert(`✅ Bienvenido ${PREVENTA_KEYS[key]}!`);
                closeModal('login');
            } else {
                alert('❌ Clave incorrecta');
            }
        }

        // ==================== MENÚ ====================
        function toggleMenu() {
            console.log('Menu clicked');
        }
    </script>
</body>
</html>
