<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="85%">
      <stop offset="0%"  stop-color="#003d7a"/>
      <stop offset="45%" stop-color="#000f2e"/>
      <stop offset="100%" stop-color="#000a1f"/>
    </radialGradient>
    <clipPath id="roundedSquare">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedSquare)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- Corona real de Los Mayorga (misma imagen que el header y la pantalla de carga) -->
    <image href="https://lh3.googleusercontent.com/d/1iRBL1dGxGqM2T-ASFx3XWlAjsVX_G0Bi"
           x="86" y="86" width="340" height="340"
           preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
